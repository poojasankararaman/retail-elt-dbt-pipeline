version: 2

models:
  - name: stg_customers
    description: Latest version of each customer. Cleans city/state formatting.
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: state
        tests: [not_null]

  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: list_price
        tests: [positive_value]

  - name: stg_orders
    description: One row per order. Dedupes, normalizes status, nulls impossible delivery timestamps.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, processing, canceled, invoiced]
      - name: purchased_at
        tests: [not_null]

  - name: stg_order_items
    description: One row per order item (grain order_id + order_item_id, tested in tests/).
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
              config:
                severity: warn   # known: orphan items exist in the raw feed
      - name: price
        tests: [not_null]

  - name: stg_payments
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_type
        tests:
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card]
