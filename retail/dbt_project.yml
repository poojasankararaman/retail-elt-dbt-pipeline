name: retail
version: "1.0.0"
config-version: 2
profile: retail

model-paths: ["models"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

models:
  retail:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

snapshots:
  retail:
    +target_schema: snapshots
